services:
  # ── Consul — Service Registry, Service Discovery, Config Server ──────────
  consul:
    image: hashicorp/consul:1.17
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -ui

  # Seeds Consul KV with Hazelcast / MQ config, then exits
  consul-init:
    build: .
    command: python scripts/seed_consul.py
    environment:
      - CONSUL_HOST=consul:8500
    depends_on:
      - consul

  # ── Hazelcast Cluster (3 nodes) ───────────────────────────────────────────
  hazelcast1:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz1

  hazelcast2:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5702:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz2

  hazelcast3:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5703:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz3

  management-center:
    image: hazelcast/management-center:5.6.0
    ports:
      - "8081:8080"
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
    environment:
      - MC_DEFAULT_CLUSTER=dev
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=counter_db
    ports:
      - "5432:5432"

  # ── Logging Services (3 instances) ───────────────────────────────────────
  logging1:
    build: .
    environment:
      - SERVICE_ID=logging1
      - SERVICE_ADDRESS=logging1:8000
      - CONSUL_HOST=consul:8500
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  logging2:
    build: .
    environment:
      - SERVICE_ID=logging2
      - SERVICE_ADDRESS=logging2:8000
      - CONSUL_HOST=consul:8500
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  logging3:
    build: .
    environment:
      - SERVICE_ID=logging3
      - SERVICE_ADDRESS=logging3:8000
      - CONSUL_HOST=consul:8500
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  # ── Counter Services (3 instances) ───────────────────────────────────────
  counter1:
    build: .
    environment:
      - SERVICE_ID=counter1
      - SERVICE_ADDRESS=counter1:8000
      - DATABASE_URL=postgresql://user:pass@db:5432/counter_db
      - CONSUL_HOST=consul:8500
    command: uvicorn services.counter.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  counter2:
    build: .
    environment:
      - SERVICE_ID=counter2
      - SERVICE_ADDRESS=counter2:8000
      - DATABASE_URL=postgresql://user:pass@db:5432/counter_db
      - CONSUL_HOST=consul:8500
    command: uvicorn services.counter.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  counter3:
    build: .
    environment:
      - SERVICE_ID=counter3
      - SERVICE_ADDRESS=counter3:8000
      - DATABASE_URL=postgresql://user:pass@db:5432/counter_db
      - CONSUL_HOST=consul:8500
    command: uvicorn services.counter.main:app --host 0.0.0.0 --port 8000
    depends_on:
      consul-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started

  # ── Facade Service ────────────────────────────────────────────────────────
  facade:
    build: .
    environment:
      - SERVICE_ID=facade
      - SERVICE_ADDRESS=facade:8000
      - CONSUL_HOST=consul:8500
    command: uvicorn services.facade.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      consul-init:
        condition: service_completed_successfully
      hazelcast1:
        condition: service_started
      hazelcast2:
        condition: service_started
      hazelcast3:
        condition: service_started
