services:
  # Hazelcast Cluster (3 nodes)
  hazelcast1:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5701:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz1

  hazelcast2:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5702:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz2

  hazelcast3:
    image: hazelcast/hazelcast:5.6.0
    ports:
      - "5703:5701"
    volumes:
      - ./hazelcast.yaml:/opt/hazelcast/hazelcast.yaml
    environment:
      - HZ_NETWORK_JOIN_MULTICAST_ENABLED=true
      - HZ_MEMBER_NAMING_CLIENT_ID=hz3

  management-center:
    image: hazelcast/management-center:5.6.0
    ports:
      - "8081:8080"
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
    environment:
      - MC_DEFAULT_CLUSTER=dev
      - MC_DEFAULT_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701

  # Config Server — service registry
  config-server:
    build: .
    command: uvicorn services.config_server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"

  # Database for counter-service
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=counter_db
    ports:
      - "5432:5432"

  # Logging Services (3 instances)
  logging1:
    build: .
    environment:
      - HZ_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
      - SERVICE_ID=logging1
      - SERVICE_ADDRESS=logging1:8000
      - CONFIG_SERVER=config-server:8000
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  logging2:
    build: .
    environment:
      - HZ_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
      - SERVICE_ID=logging2
      - SERVICE_ADDRESS=logging2:8000
      - CONFIG_SERVER=config-server:8000
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  logging3:
    build: .
    environment:
      - HZ_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
      - SERVICE_ID=logging3
      - SERVICE_ADDRESS=logging3:8000
      - CONFIG_SERVER=config-server:8000
    command: uvicorn services.logging.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  # Counter Service — consumes from Hazelcast queue, stores to PostgreSQL
  counter:
    build: .
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/counter_db
      - HZ_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
      - SERVICE_ADDRESS=counter:8000
      - CONFIG_SERVER=config-server:8000
    command: uvicorn services.counter.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server

  # Facade Service — API gateway
  facade:
    build: .
    environment:
      - HZ_CLUSTER_MEMBERS=hazelcast1:5701,hazelcast2:5701,hazelcast3:5701
      - CONFIG_SERVER=config-server:8000
    command: uvicorn services.facade.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - hazelcast1
      - hazelcast2
      - hazelcast3
      - config-server
      - logging1
      - logging2
      - logging3
      - counter
